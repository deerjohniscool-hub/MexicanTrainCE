name: Build Mexican Train for TI-84 Plus CE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CEdev
        run: |
          wget -q https://github.com/CE-Programming/toolchain/releases/download/nightly/CEdev-Linux-nightly.tar.gz
          tar -xzf CEdev-Linux-nightly.tar.gz

      - name: Add CEdev to PATH
        run: |
          echo "$GITHUB_WORKSPACE/CEdev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/CEdev/binutils/bin" >> "$GITHUB_PATH"

      - name: Check toolchain
        run: |
          cedev-config --version
          ez80-clang --version
          ez80-link --version

      - name: Build game
        run: make

      - name: Upload 8XP
        uses: actions/upload-artifact@v4
        with:
          name: Mexican-Train-8XP
          path: bin/*.8xp
          if-no-files-found: error
